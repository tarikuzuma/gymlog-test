<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}{% endblock %}</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/RF.png') }}">
    <!-- <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}"> -->    
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-r from-stone-400 to-green-200">
    
    <!-- Header with Logo -->
    <div class="px-6 py-4">
        <a href="/" class="inline-block">
            <img src="{{ url_for('static', filename='images/RF.png') }}" alt="Logo" class="h-24">
        </a>
    </div>
    
    <!-- Main Content Area -->
    <div class="px-6 pb-8">
        {% block content %}
            <!-- Content goes here -->
        {% endblock %}
    </div>

    <!--Removes autocomplete for all forms-->
    <script src="{{ url_for('static', filename='js/autoCompleteOff.js') }}"></script>

</body>
</html>
